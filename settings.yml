# Prontera Portal — homepage hero + instance cards for the root domain
# (prontera.info). Install this as a component of the "Prontera" theme.
# All copy and links are editable here so the maintainer never edits code.

portal_enabled:
  type: bool
  default: true
  description: "Render the portal hero and instance cards at the top of the homepage."

hero_eyebrow:
  type: string
  default: "The Prontera.info Network"
  description: "Small uppercase kicker above the hero title."

hero_title:
  type: string
  default: "Your Ragnarok Online home base."
  description: "Main hero headline (Cinzel)."

hero_subtitle:
  type: string
  default: "Databases, guides and a community for every Ragnarok Online server we cover — kept accurate, in one place. Pick your world below, or head straight into the forum."
  description: "Supporting hero paragraph."

hero_emblem:
  type: bool
  default: true
  description: "Show the Prontera emblem above the hero title."

hero_cta_label:
  type: string
  default: "Enter the forum"
  description: "Primary hero button label. Leave empty to hide it."
hero_cta_url:
  type: string
  default: "/latest"
  description: "Primary hero button link."
hero_cta_secondary_label:
  type: string
  default: "Browse categories"
  description: "Secondary hero button label. Leave empty to hide it."
hero_cta_secondary_url:
  type: string
  default: "/categories"
  description: "Secondary hero button link."

ro3_enabled:
  type: bool
  default: true
  description: "Show the RO3 instance card."
ro3_name:
  type: string
  default: "RO3 Hub"
  description: "RO3 card title."
ro3_tagline:
  type: string
  default: "Ragnarok Online 3"
  description: "RO3 card subline."
ro3_url:
  type: string
  default: "https://ro3.prontera.info"
  description: "RO3 hub URL."

roz_enabled:
  type: bool
  default: true
  description: "Show the ROZ instance card."
roz_name:
  type: string
  default: "RO Zero Hub"
  description: "ROZ card title."
roz_tagline:
  type: string
  default: "Ragnarok Online Zero"
  description: "ROZ card subline."
roz_url:
  type: string
  default: "https://roz.prontera.info"
  description: "ROZ hub URL."
